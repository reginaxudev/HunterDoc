name: Deploy

# Ships a published release by tag: what reaches production is exactly the
# artifact that was built and tagged, never a rebuild.
#
# Two entry points on purpose:
#   workflow_call     release.yml calls this right after publishing, so a push
#                     to release/x.y.z goes all the way to production
#   workflow_dispatch run it by hand with any older tag — that is the rollback
#                     path, and it costs one dispatch rather than a revert and
#                     a rebuild
on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to deploy, e.g. v0.4.0"
        required: true
        type: string

permissions:
  contents: read

# One deploy at a time. server-deploy.sh replaces the standalone tree in place
# and reloads pm2, so two overlapping runs would interleave file writes on the
# same directory. Queue rather than cancel: cancelling mid-transfer would leave
# a partially written bundle on the box.
concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://hunterdoc.expture.cn
    steps:
      - name: Validate tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # The tag reaches gh and the shell below, so constrain its shape.
          if ! printf '%s' "$TAG" | grep -qE '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::tag must look like v1.2.3, got ${TAG}"
            exit 1
          fi

      - name: Fetch the release bundle
        env:
          TAG: ${{ inputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "$TAG" --pattern bundle.tar.gz
          ls -lh bundle.tar.gz

      - name: Ship and deploy
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_HOST_KEY: ${{ secrets.DEPLOY_HOST_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # Pin the host key rather than disabling the check, so a hijacked DNS
          # or IP cannot harvest this connection.
          printf '%s\n' "$DEPLOY_HOST_KEY" > ~/.ssh/known_hosts
          # The key is restricted server-side to the receive script, so any
          # command sent here is ignored; the tarball on stdin is the payload.
          ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts \
            "${DEPLOY_USER}@${DEPLOY_HOST}" < bundle.tar.gz

      - name: Verify the site answers
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          code="$(curl -s -o /dev/null -m 20 -w '%{http_code}' https://hunterdoc.expture.cn/api/health)"
          if [ "$code" != "200" ]; then
            echo "::error::health check returned ${code} after deploy"
            exit 1
          fi
          echo "::notice::${TAG} deployed, health check passed."
