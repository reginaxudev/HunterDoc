# 本地一键 Docker：App + PostgreSQL
# 用法：npm run docker:local
# 打开：http://localhost:3000/login

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-headhunter}
    volumes:
      - hunterdoc_pgdata:/var/lib/postgresql/data
    networks:
      - hunterdoc
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-headhunter}",
        ]
      interval: 3s
      timeout: 5s
      retries: 20

  app:
    image: ${DOCKER_IMAGE:-hunterdoc:local}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_PARTYKIT_HOST: ${NEXT_PUBLIC_PARTYKIT_HOST:-localhost:1999}
        NEXT_PUBLIC_SYNC_ENABLED: "false"
        NEXT_PUBLIC_SYNC_POLL_INTERVAL_MS: "5000"
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    env_file:
      - .env.docker.local
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-headhunter}
      RUN_DB_SEED: ${RUN_DB_SEED:-true}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
    volumes:
      - hunterdoc_uploads:/app/public/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - hunterdoc
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

networks:
  hunterdoc:

volumes:
  hunterdoc_pgdata:
  hunterdoc_uploads:
