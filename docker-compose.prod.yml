# 生产环境 Docker Compose（App + Caddy HTTPS）
# 1. cp .env.docker.example .env.production && 编辑
# 2. node scripts/init-production-env.mjs   （或手动编辑）
# 3. npm run deploy:docker

services:
  app:
    image: ${DOCKER_IMAGE:-ghcr.io/reginaxudev/hunterdoc:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
        NEXT_PUBLIC_PARTYKIT_HOST: ${NEXT_PUBLIC_PARTYKIT_HOST:-localhost:1999}
        NEXT_PUBLIC_SYNC_ENABLED: ${NEXT_PUBLIC_SYNC_ENABLED:-false}
        NEXT_PUBLIC_SYNC_POLL_INTERVAL_MS: ${NEXT_PUBLIC_SYNC_POLL_INTERVAL_MS:-5000}
    restart: unless-stopped
    expose:
      - "3000"
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
    volumes:
      - uploads:/app/public/uploads
    networks:
      - web
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      app:
        condition: service_healthy
    networks:
      - web

  postgres:
    profiles: ["with-db"]
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-headhunter}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - web
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-headhunter}"]
      interval: 5s
      timeout: 5s
      retries: 10

networks:
  web:

volumes:
  pgdata:
  uploads:
  caddy_data:
  caddy_config:
